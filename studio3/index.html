<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library liberty</title>

    <!-- Normalize CSS for browser compatability -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grandstander&display=swap" rel="stylesheet">

    <!-- My Styles -->
    <link href="styles.css" rel="stylesheet">

    <!-- My Script -->
    <script src="script.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/granim@2.0.0/dist/granim.min.js"></script>

    <script src="p5.min.js"></script>

</head>
<body>
    <!--gradient-->
    <canvas id="granim-canvas"></canvas>

    <!--fish-->
    <div id="p5-container"></div>

    <!--ui-->
    <div id="ui">
        <div id="title">
            <h1>Don't Touch the Fish!</h1>
        </div>

        <div id="fish-count"><span id="count">20</span> fish in the tank</div>
        <div id="tip">Hover over the fish!</div>
    </div>

    <footer id="footer">
        Libraries used: 
        <a href="https://p5js.org" target="_blank">P5.js</a> &amp; 
        <a href="https://sarcadass.github.io/granim.js/" target="_blank">Granim.js</a>
    </footer>
    
</body>
</html>
